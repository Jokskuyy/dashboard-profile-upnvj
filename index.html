<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon - Multiple sizes for better compatibility -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/logoupnvj-192.png"
    />
    <link rel="apple-touch-icon" sizes="512x512" href="/logoupnvj.png" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover"
    />

    <!-- Material Icons loaded locally via src/styles/material-icons.css -->

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="Dashboard Profile Universitas Pembangunan Nasional Veteran Jakarta - Data Dosen, Mahasiswa, Akreditasi, dan Fasilitas Kampus"
    />
    <meta
      name="keywords"
      content="UPNVJ, Universitas Pembangunan Nasional Veteran Jakarta, Dashboard, Profil Kampus, Dosen, Mahasiswa, Akreditasi"
    />
    <meta name="author" content="UPNVJ" />
    <meta name="theme-color" content="#2C5F2D" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dashboard Profile UPNVJ" />
    <meta
      property="og:description"
      content="Dashboard Profile Universitas Pembangunan Nasional Veteran Jakarta - Data Dosen, Mahasiswa, Akreditasi, dan Fasilitas Kampus"
    />
    <meta property="og:image" content="/logoupnvj.png" />
    <meta property="og:locale" content="id_ID" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dashboard Profile UPNVJ" />
    <meta
      name="twitter:description"
      content="Dashboard Profile Universitas Pembangunan Nasional Veteran Jakarta - Data Dosen, Mahasiswa, Akreditasi, dan Fasilitas Kampus"
    />
    <meta name="twitter:image" content="/logoupnvj.png" />

    <!-- iOS specific meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <!-- Android specific -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Umami Analytics script is injected at runtime by src/components/analytics/Analytics.tsx -->
    <!-- Configuration: VITE_UMAMI_URL and VITE_UMAMI_WEBSITE_ID in .env -->

    <!-- Preload LCP image (first hero carousel slide) -->
    <link rel="preload" as="image" href="/hero1.webp" type="image/webp" fetchpriority="high" />

    <title>
      Dashboard Profile UPNVJ | Universitas Pembangunan Nasional Veteran Jakarta
    </title>
  </head>
  <body>
    <noscript>
      <div style="padding: 2rem; text-align: center; font-family: sans-serif">
        <h1>Dashboard Profile UPNVJ</h1>
        <p>
          Aplikasi ini membutuhkan JavaScript untuk berjalan. Silakan aktifkan
          JavaScript pada browser Anda.
        </p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
